name: fluxa
description: "Fluxa — Control the Flow."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Dependency injection
  get_it: ^8.2.0

  # Navigation
  go_router: ^16.2.4

  # Vector assets (SVG layers are animated individually, never rasterised)
  flutter_svg: ^2.2.1

  # Declarative animation composition
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/svg/

  fonts:
    - family: 'Sirin Stencil'
      fonts:
        - asset: assets/font/SirinStencil-Regular.ttf
          weight: 400
        # - asset: assets/font/SirinStencil-Bold.ttf
        #   weight: 700
